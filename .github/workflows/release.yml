name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64, "386"]
        exclude:
          - goos: darwin
            goarch: "386"
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get project dependencies
        run: go mod download

      - name: Build
        run: |
          mkdir -p build_assets
          BINARY_NAME="reseller-bot"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="reseller-bot.exe"
          fi
          go build -v -o "build_assets/${BINARY_NAME}" -trimpath -ldflags "-s -w" ./cmd/bot

      - name: Prepare Assets
        run: |
          cp README.md build_assets/
          cp config.yaml.template build_assets/

      - name: Create Archive
        id: archive
        run: |
          ARCHIVE_NAME="reseller-bot-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd build_assets
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "../${ARCHIVE_NAME}.zip" .
            echo "filename=${ARCHIVE_NAME}.zip" >> $GITHUB_OUTPUT
          else
            tar -czf "../${ARCHIVE_NAME}.tar.gz" .
            echo "filename=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.zip
            *.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
